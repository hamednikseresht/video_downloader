[project]
name = "youtube-downloader"
version = "3.0"
description = "Streamlit app to download YouTube and Instagram videos, audio, and subtitles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "yt-dlp[default,curl-cffi]>=2026.6.9,<2027",
    "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
